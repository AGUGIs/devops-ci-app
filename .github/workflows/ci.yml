name: CI — verify and publish image
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Pylint
        run: python -m pylint app --score=no
  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - name: Build images
        run: |
          for arch in amd64 arm64; do
            docker build --platform "linux/${arch}" --tag "devops-ci-app:${GITHUB_SHA}-${arch}" .
          done
      - name: Smoke-test container
        run: |
          set -euo pipefail
          cleanup() {
            docker logs smoke || true
            docker rm -f smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for arch in amd64 arm64; do
            docker run -d --platform "linux/${arch}" --name smoke -p 127.0.0.1:5000:5000 "devops-ci-app:${GITHUB_SHA}-${arch}"
            ready=0
            for attempt in {1..15}; do
              if curl --fail --silent --show-error --max-time 2 \
                http://127.0.0.1:5000/health --output health.json; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "::error::/health did not respond after 15 attempts"
              exit 1
            fi
            python3 -m json.tool health.json
            python3 - <<'PY'
            import json
            from pathlib import Path

            payload = json.loads(Path("health.json").read_text(encoding="utf-8"))
            assert payload == {"status": "ok"}, f"unexpected /health payload: {payload}"
            PY
            docker exec smoke id
            cleanup
          done
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker tag "devops-ci-app:${GITHUB_SHA}-${arch}" "${IMAGE_NAME}:${GITHUB_SHA}-${arch}"
            docker push "${IMAGE_NAME}:${GITHUB_SHA}-${arch}"
          done
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${GITHUB_SHA}" --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${GITHUB_SHA}-amd64" "${IMAGE_NAME}:${GITHUB_SHA}-arm64"
  deploy:
    needs: image
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, devops-vm]
    permissions:
      contents: read
    concurrency:
      group: deploy-devops-vm
      cancel-in-progress: false
    env:
      VM_HOST: 192.168.255.101
      VM_HTTP_PORT: 8080
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Deploy with Ansible
        working-directory: ansible
        run: ansible-playbook site.yml -e "app_tag=${GITHUB_SHA}"
      - name: Check through Nginx
        run: curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "http://${VM_HOST}:${VM_HTTP_PORT}/health"
