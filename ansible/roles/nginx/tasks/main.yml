---
- name: Create proxy configuration directory
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.local/share/devops-ci-app"
    state: directory
    mode: "0755"
- name: Configure application reverse proxy
  ansible.builtin.template:
    src: devops-ci-app.conf.j2
    dest: "{{ ansible_user_dir }}/.local/share/devops-ci-app/default.conf"
    mode: "0644"
  notify: Reload application proxy
- name: Run dedicated Nginx container
  community.docker.docker_container:
    name: devops-ci-app-nginx
    image: "{{ nginx_image }}"
    network_mode: host
    state: started
    restart_policy: unless-stopped
    volumes:
      - "{{ ansible_user_dir }}/.local/share/devops-ci-app/default.conf:/etc/nginx/conf.d/default.conf:ro"
