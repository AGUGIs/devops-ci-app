---
- name: Create automation user
  ansible.builtin.user:
    name: devops
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
- name: Create SSH directory
  ansible.builtin.file:
    path: /home/devops/.ssh
    state: directory
    owner: devops
    group: devops
    mode: "0700"
- name: Install automation public key
  ansible.posix.authorized_key:
    user: devops
    state: present
    key: "{{ lookup('file', automation_public_key_file) }}"
    manage_dir: false
- name: Allow non-interactive automation sudo
  ansible.builtin.copy:
    content: "devops ALL=(ALL) NOPASSWD:ALL\n"
    dest: /etc/sudoers.d/devops
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
- name: Allow the new Nginx endpoint
  community.general.ufw:
    rule: allow
    port: "{{ nginx_port }}"
    to_ip: "{{ nginx_ip }}"
    proto: tcp
